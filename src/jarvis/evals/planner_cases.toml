# Planner test set for `jarvis eval`. Each request is planned once (the first
# round only) with the real model; nothing is executed.
#
#   action = acceptable plan actions: execute, clarify, respond
#   tools  = acceptable first-round tool lists (order doesn't matter);
#            leave out for clarify/respond, which must have no steps
#   args   = per tool, argument -> required text (case-insensitive, contained
#            in some step's value); "a|b" accepts either; a list requires each
#
# Siri-style requests with no tool yet expect "respond" (decline). When a phase
# adds the tool, update those cases: the score shows what each phase changed.

apps = [
    "Calculator", "Calendar", "Finder", "Google Chrome", "Mail", "Maps", "Messages",
    "Music", "Notes", "Photo Booth", "Photos", "Preview", "Reminders", "Safari",
    "System Settings", "Terminal", "TextEdit", "Visual Studio Code", "Weather",
]

